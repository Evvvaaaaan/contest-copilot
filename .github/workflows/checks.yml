name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-helper:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise state, records, workflow and local app
        run: python -m unittest discover -s tests -v
      - name: Exercise the retrospective example
        working-directory: examples/nasa-farm-navigators
        run: python -m unittest discover -s . -p "test_*.py" -v
