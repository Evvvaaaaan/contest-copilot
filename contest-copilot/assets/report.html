<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>{{title}}</title>
<style>
body { max-width: 900px; margin: 48px auto; padding: 0 24px; color: #20242a; background: white; font: 16px/1.8 system-ui, sans-serif; }
h1 { margin: 0 0 24px; font-size: 2rem; line-height: 1.35; letter-spacing: -.03em; }
h2 { margin: 40px 0 16px; padding-top: 20px; border-top: 1px solid #e5e7eb; font-size: 1.2rem; }
p, li { white-space: pre-wrap; overflow-wrap: anywhere; }
ul { padding-left: 24px; }
li { margin: 12px 0; }
li.detail { margin: 6px 0 6px 16px; color: #525b67; font-size: .9rem; list-style-type: circle; }
strong { color: #20242a; font-weight: 650; }
@media print { body { margin: 0; max-width: none; font-size: 11pt; } h1, h2 { break-after: avoid; } }
</style>
<main>{{content}}</main>
</html>
